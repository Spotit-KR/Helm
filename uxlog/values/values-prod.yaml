nameOverride: "spotit-uxlog"
fullnameOverride: "spotit-uxlog"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: team-io-kr-letsencrypt-prod
  hosts:
    - host: uxlog.team.io.kr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: spotit-uxlog-tls
      hosts:
        - uxlog.team.io.kr

resources:
    requests:
      memory: 2Gi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: 200m

image:
  repository: "harbor.homelab.robinjoon.xyz/spotit/uxlog"
  tag: "20260124-7"

imagePullSecrets:
  - name: "spotit-harbor-secret"

ports:
  - containerPort: 8080 # 컨테이너 포트 명시
readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"       # 혹은 /health 등 실제 헬스체크 경로
    port: 8080    # 앱이 사용하는 실제 포트로 변경
  initialDelaySeconds: 60 # 앱 구동 시간 고려하여 대기 시간 추가
livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"       # 혹은 /health 등 실제 헬스체크 경로
    port: 8080    # 앱이 사용하는 실제 포트로 변경
  initialDelaySeconds: 60 # 앱 구동 시간 고려하여 대기 시간 추가

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

service:
  port: 8080

# Environment variables from Secret
# Secret 생성 방법: backend-secret.yaml 파일 생성 후 적용
#
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: backend-secret
#   namespace: growweek
# type: Opaque
# stringData:
#   SPRING_PROFILES_ACTIVE: "dev"
#   DB_HOST: ""
#   DB_PORT: ""
#   DB_NAME: ""
#   DB_USERNAME: ""
#   DB_PASSWORD: ""
#   JWT_SECRET: ""
#   JWT_EXPIRATION: "3600000"
#   GEMINI_API_KEY: ""
# ---
#
# kubectl apply -f backend-secret.yaml
envFrom:
  - secretRef:
      name: backend-secret